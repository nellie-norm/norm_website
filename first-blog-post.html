<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Blog Post - Nell Norman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #fff;
            color: #000;
            padding: 40px 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        
        .back-button {
            font-size: 18px;
            color: #666;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 40px;
            transition: opacity 0.2s ease;
        }
        
        .back-button:hover {
            opacity: 0.6;
        }
        
        .post-header {
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 42px;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        
        .post-meta {
            font-size: 16px;
            color: #666;
        }
        
        .post-content {
            font-size: 18px;
            color: #333;
            line-height: 1.7;
        }
        
        .post-content p {
            margin-bottom: 24px;
        }
        
        .post-content h2 {
            font-size: 28px;
            font-weight: 600;
            margin-top: 40px;
            margin-bottom: 20px;
            color: #000;
        }
        
        .post-content h3 {
            font-size: 22px;
            font-weight: 500;
            margin-top: 32px;
            margin-bottom: 16px;
            color: #000;
        }
        
        .post-content a {
            color: #000;
            text-decoration: underline;
            text-underline-offset: 2px;
            transition: opacity 0.2s ease;
        }
        
        .post-content a:hover {
            opacity: 0.6;
        }
        
        .post-content ul, .post-content ol {
            margin-bottom: 24px;
            padding-left: 24px;
        }
        
        .post-content li {
            margin-bottom: 8px;
        }
        
        .post-content blockquote {
            border-left: 3px solid #000;
            padding-left: 20px;
            margin: 24px 0;
            font-style: italic;
            color: #555;
        }
        
        .post-content pre {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 24px 0;
            font-family: 'Courier New', monospace;
            font-size: 16px;
        }
        
        .post-content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .post-content img {
            max-width: 100%;
            height: auto;
            margin: 32px 0;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }
            
            .post-content {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← back to home</a>
        
        <article>
            <div class="post-header">
                <h1>wait for it !</h1>
                <div class="post-meta">January 15, 2024</div>
            </div>
            
            <div class="post-content">
                <p>
                    
                </p>
            </div>
        </article>
    </div>
</body>
</html>
